[project]
name = "bitcoin-24h-forecast"
version = "1.0.0"
description = "Multivariate Multi-Horizon Bitcoin 24-Hour Deep Learning Forecast (FastAPI + Pure NumPy)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0,<1.0.0",
    "pandas>=2.2.0,<3.0.0",
    "numpy>=2.0.0,<3.0.0",
    "h5py>=3.11.0,<4.0.0",
]

[tool.vercel]
entrypoint = "deploy.main:app"
